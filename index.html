try{const j=JSON.parse(localStorage.getItem(KEY)||'{}');S={...S,...j,cfg:{...S.cfg,...j.cfg},set:{...S.set,...j.set}};if(!Array.isArray(S.convs))S.convs=[]}catch(e){S=def()}
const R={view:'chat',status:'off',busy:false,file:null,start:Date.now(),rec:null};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));return true}catch(e){toast('Local storage unavailable or full','err');return false}};
const cur=()=>S.convs.find(c=>c.id===S.cur);
const tm=t=>new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
const dur=()=>{const s=Math.floor((Date.now()-R.start)/1000);return [Math.floor(s/3600),Math.floor(s/60)%60,s%60].map(v=>String(v).padStart(2,'0')).join(':')};

/* ---------- Utilities ---------- */
function toast(m,t=''){const e=document.createElement('div');e.className='toast '+t;e.textContent=m;$('#toasts').append(e);setTimeout(()=>e.remove(),3200)}
async function copy(txt){try{await navigator.clipboard.writeText(txt)}catch(e){const a=document.createElement('textarea');a.value=txt;document.body.append(a);a.select();try{document.execCommand('copy')}catch(_){toast('Copy failed','err');a.remove();return}a.remove()}toast('Copied to clipboard')}
function fmt(t){return t.split('```').map((p,i)=>{if(i%2){const n=p.indexOf('\n'),lang=n>-1?p.slice(0,n).trim():'',code=n>-1?p.slice(n+1):p;return `<div class="code"><div class="ch"><span>${esc(lang||'code')}</span><button data-act="cc">${I('copy')}Copy</button></div><pre>${esc(code)}</pre></div>`}
return esc(p).replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/^#{1,3} (.+)$/gm,'<h4>$1</h4>').replace(/^[-*] (.+)$/gm,'<li>$1</li>').replace(/(<\/h4>|<\/li>)\n/g,'$1').replace(/\n/g,'<br>')}).join('')}
function scrollEnd(){const v=$('#view');v.scrollTop=v.scrollHeight}

/* ---------- API ---------- */
async function call(extra,cfg=S.cfg){
 const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),45000);let r;
 try{r=await fetch(cfg.endpoint,{method:'POST',signal:ctl.signal,headers:{'Content-Type':'application/json',Authorization:'Bearer '+(cfg.key||'unused')},body:JSON.stringify({model:cfg.model,...extra})})}
 catch(e){throw new Error(e.name==='AbortError'?'Request timed out after 45s.':'Network error - check your connection, endpoint URL, or CORS support.')}
 finally{clearTimeout(to)}
 const raw=await r.text();let d=null;try{d=JSON.parse(raw)}catch(e){}
 if(!r.ok){let m=d&&((d.error&&(d.error.message||d.error))||d.message)||'';if(typeof m!=='string')m=JSON.stringify(m);throw new Error((HTTP[r.status]||'HTTP '+r.status)+(m?' ('+m.slice(0,200)+')':''))}
 if(!d)throw new Error('Invalid response: the API did not return JSON.');
 return d}
function extract(d){const c=d&&d.choices&&d.choices[0];let t=c&&((c.message&&c.message.content!=null?c.message.content:c.text));if(Array.isArray(t))t=t.map(x=>x&&x.text||'').join('');
 if(typeof t!=='string'||!t.trim())throw new Error('The API returned an empty or unexpected response.');return t}
function setStatus(s){R.status=s;const e=$('#stat');if(e){e.className='pill '+s;e.textContent=LBL[s]}const a=$('#a-s');if(a){a.className='pill '+s;a.textContent=LBL[s]}}

/* ---------- Chat ---------- */
function newConv(){const c={id:uid(),title:'New chat',msgs:[],ts:Date.now()};S.convs.unshift(c);S.cur=c.id;return c}
function go(v){R.view=v;$('#side').classList.remove('open');$('#scrim').classList.remove('show');render()}
async function send(){
 if(R.busy)return;const inp=$('#inp'),text=inp.value.trim();if(!text&&!R.file)return;
 const cf=S.cfg;if(!cf.endpoint){toast('Set an endpoint first','err');return openApi()}
 if(cf.provider!=='llm7'&&!cf.key){toast('Add your API key first','err');return openApi()}
 const c=cur()||newConv();const f=R.file;
 const m={r:'user',c:text||('Attached: '+f.name),t:Date.now()};
 if(f){m.f=f.name;m.a=(text?text+'\n\n':'')+(f.text!=null?'--- file: '+f.name+' ---\n'+f.text:'[Attached file: '+f.name+' (binary content not readable in browser)]')}
 c.msgs.push(m);if(c.title==='New chat')c.title=m.c.slice(0,40);
 inp.value='';inp.style.height='auto';R.file=null;chip();R.view='chat';save();await ask(c)}
async function ask(c){
 R.busy=true;render();let ok=false;
 try{
  const msgs=[{role:'system',content:"You are HEXORB, an advanced AI assistant inside a futuristic HUD. Reply in the user's language. Use markdown code fences for code."},...c.msgs.filter(m=>!m.e).slice(-20).map(m=>({role:m.r==='user'?'user':'assistant',content:m.a||m.c}))];
  const txt=extract(await call({messages:msgs}));
  c.msgs.push({r:'nova',c:txt,t:Date.now()});S.reqs++;setStatus('ok');ok=true;
 }catch(e){c.msgs.push({r:'nova',c:e.message,t:Date.now(),e:1});setStatus('err')}
 R.busy=false;S.last=Date.now();save();render();if(ok)typeLast()}
function typeLast(){
 const el=$('.msg.nova:last-child .body'),c=cur(),m=c&&c.msgs[c.msgs.length-1];if(!el||!m||m.e||S.set.reduce)return;
 el.innerHTML='';let i=0;const n=m.c.length,st=Math.max(3,Math.ceil(n/120));
 const iv=setInterval(()=>{i+=st;if(!el.isConnected||i>=n){clearInterval(iv);if(el.isConnected){el.innerHTML=fmt(m.c);if(S.set.auto)scrollEnd()}return}el.innerHTML=fmt(m.c.slice(0,i));if(S.set.auto)scrollEnd()},25)}
function setPrompt(p){R.view='chat';render();const i=$('#inp');i.value=p;i.focus();i.setSelectionRange(p.length,p.length);resize()}
function resize(){const i=$('#inp');i.style.height='auto';i.style.height=Math.min(i.scrollHeight,160)+'px'}
function chip(){$('#chip').innerHTML=R.file?`<span class="fchip">${I('clip')}${esc(R.file.name)} <small>${(R.file.size/1024).toFixed(1)} KB</small><button data-act="rmfile" aria-label="Remove">${I('x')}</button></span>`:''}

/* ---------- Views ---------- */
const core=`<div class="core"><svg viewBox="0 0 200 200"><defs><radialGradient id="cg"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="var(--ac)"/><stop offset="1" stop-color="var(--ac2)" stop-opacity="0"/></radialGradient></defs>
<g class="rg"><circle cx="100" cy="100" r="92" fill="none" stroke="var(--ac)" stroke-width="2" stroke-dasharray="4 10 60 10" opacity=".8"/></g>
<g class="rg rg2"><circle cx="100" cy="100" r="76" fill="none" stroke="var(--ac2)" stroke-width="2.5" stroke-dasharray="90 20 10 20"/></g>
<circle cx="100" cy="100" r="60" fill="none" stroke="var(--bd)" stroke-width="1"/>
<circle class="cc" cx="100" cy="100" r="42" fill="url(#cg)"/><circle cx="100" cy="100" r="10" fill="#fff"/></svg></div>`;
const stat=(k,v,id)=>`<div class="st"><small>${k}</small><b${id?` class="${id}"`:''}>${v}</b></div>`;
function hud(){const c=cur();return `<div class="wrap"><div class="hud">${core}<h1>HEXORB ONLINE</h1><div class="by c">by karensol</div>
<div class="info"><span class="chip">Link <b>${LBL[R.status]}</b></span><span class="chip">Model <b>${esc(S.cfg.model||'-')}</b></span><span class="chip">Session <b class="sess">${dur()}</b></span></div></div>
<div class="grid">${Object.entries(Q).map(([k,v])=>`<button class="qa" data-act="qa:${k}">${I(v[0])}<b>${k}</b><small>${esc(v[1].trim().slice(0,38))}</small></button>`).join('')}</div></div>`}
function msg(m,i,a){const last=i===a.length-1&&m.r==='nova';return `<div class="msg ${m.r}${m.e?' err':''}"><div class="who">${m.r==='user'?'YOU':'HEXORB'} &middot; ${tm(m.t)}</div><div class="body" dir="auto">${fmt(m.c)}${m.f?`<div class="chip" style="margin-top:6px">${I('clip')}${esc(m.f)}</div>`:''}</div><div class="acts"><button data-act="cp:${i}">${I('copy')}Copy</button>${last?`<button data-act="rg">${I('refresh')}Regenerate</button>`:''}</div></div>`}
const VIEWS={
 chat(){const c=cur();if(!c||(!c.msgs.length&&!R.busy))return hud();
  return `<div class="msgs">${c.msgs.map(msg).join('')}${R.busy?'<div class="msg nova"><div class="who">HEXORB</div><div class="body"><span class="dots"><i></i><i></i><i></i></span></div></div>':''}</div>`},
 dash(){let ls='Unavailable';try{localStorage.setItem('nova.t','1');localStorage.removeItem('nova.t');ls='OK - '+((localStorage.getItem(KEY)||'').length/1024).toFixed(1)+' KB used'}catch(e){}
  const n=S.convs.reduce((a,c)=>a+c.msgs.length,0);
  return `<div class="wrap"><h2>Dashboard</h2><div class="grid">${stat('Messages',n)}${stat('Session duration',dur(),'sess')}${stat('Current model',esc(S.cfg.model||'-'))}${stat('API status',LBL[R.status])}${stat('Last activity',new Date(S.last).toLocaleString())}${stat('Requests',S.reqs)}${stat('Conversations',S.convs.length)}${stat('Local storage',ls)}</div></div>`},
 hist(){return `<div class="wrap"><div class="row" style="justify-content:space-between;margin-bottom:14px"><h2 style="margin:0">History</h2><button class="btn pri" data-act="new">${I('plus')}New</button></div>`+(S.convs.length?S.convs.map(c=>`<div class="card hi"><button class="t" data-act="open:${c.id}"><b>${esc(c.title)}</b><small style="color:var(--mu)">${c.msgs.length} messages &middot; ${new Date(c.ts).toLocaleDateString()}${c.id===S.cur?' &middot; active':''}</small></button><button class="ib" data-act="ren:${c.id}" title="Rename">${I('edit')}</button><button class="ib" data-act="del:${c.id}" title="Delete">${I('trash')}</button></div>`).join(''):'<div class="empty">No conversations yet. Start a new chat to see it here.</div>')+'</div>'},
 tools(){return `<div class="wrap"><h2>Tools</h2><div class="grid">${Object.entries(TOOLS).map(([k,v])=>`<button class="qa" data-act="tool:${k}">${I(v[0])}<b>${k}</b><small>Insert prompt into composer</small></button>`).join('')}</div></div>`}
};
function render(){
 $('#stat').className='pill '+R.status;$('#stat').textContent=LBL[R.status];
 const on=navigator.onLine;$('#net').className='dot '+(on?'on':'off');$('#nettx').textContent=on?'Online':'Offline';
 $('#mdl').textContent=S.cfg.model||'-';$('#thi').innerHTML=I(S.set.theme==='dark'?'sun':'moon');
 document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('act',b.dataset.nav===R.view));
 $('#view').innerHTML=VIEWS[R.view]();
 if(R.view==='chat'&&S.set.auto)scrollEnd();else $('#view').scrollTop=0}
function apply(){const h=document.documentElement;h.dataset.theme=S.set.theme;h.dataset.anim=S.set.anim;document.body.classList.toggle('rm',!!S.set.reduce)}

/* ---------- Modals ---------- */
function modal(title,body,cls=''){$('#modal').innerHTML=`<div class="card ${cls}" role="dialog" aria-modal="true"><div class="mh"><b>${title}</b><button class="ib" data-act="mc" aria-label="Close">${I('x')}</button></div>${body}</div>`;$('#modal').classList.add('show')}
const mclose=()=>$('#modal').classList.remove('show');
function openApi(){const c=S.cfg;modal('API Connection Center',`<div class="warn">Security: the API key is stored unencrypted in this browser's localStorage. Use it only on devices you trust.</div>
<label>Provider<select id="a-p">${Object.entries(P).map(([k,v])=>`<option value="${k}"${k===c.provider?' selected':''}>${v.n}</option>`).join('')}</select></label>
<label>API Key<div class="row"><input id="a-k" type="password" autocomplete="off" spellcheck="false" value="${esc(c.key)}"><button class="ib" data-act="eye" title="Show / hide">${I('eye')}</button><button class="ib" data-act="kc" title="Copy key">${I('copy')}</button></div></label>
<label>Model<input id="a-m" value="${esc(c.model)}" spellcheck="false"></label>
<label>Endpoint<input id="a-e" value="${esc(c.endpoint)}" spellcheck="false" dir="ltr"></label>
<div style="margin-bottom:12px"><span id="a-s" class="pill ${R.status}">${LBL[R.status]}</span> <small style="color:var(--mu)">LLM7 works without a key.</small></div>
<div class="row wrap"><button class="btn" data-act="atest">Test connection</button><button class="btn pri" data-act="asave">Save</button><button class="btn dng" data-act="aclear">Clear</button></div>`)}
function fields(){return{provider:$('#a-p').value,key:$('#a-k').value.trim(),model:$('#a-m').value.trim(),endpoint:$('#a-e').value.trim()}}
function openSettings(){const s=S.set,sw=(k,l)=>`<label class="sw">${l}<input type="checkbox" data-set="${k}"${s[k]?' checked':''}></label>`;
 modal('Settings',`<label>Theme<select data-set="theme"><option value="dark"${s.theme==='dark'?' selected':''}>Dark - Cyber</option><option value="light"${s.theme==='light'?' selected':''}>Light - Premium</option></select></label>
<label>Animation intensity<select data-set="anim">${['low','normal','high'].map(v=>`<option${s.anim===v?' selected':''}>${v}</option>`).join('')}</select></label>
${sw('reduce','Reduce motion')}${sw('auto','Auto scroll')}${sw('enter','Enter to send')}
<div class="row wrap" style="margin-top:8px"><button class="btn" data-act="api">${I('plug')}API settings</button><button class="btn dng" data-act="wipe">${I('trash')}Clear local data</button></div>`)}
const CMDS=[['New chat',()=>{newConv();save();go('chat');$('#inp').focus()}],['Open chat',()=>go('chat')],['Dashboard',()=>go('dash')],['History',()=>go('hist')],['Tools',()=>go('tools')],['Settings',openSettings],['API Connection',openApi],['Toggle theme',toggleTheme],['Clear conversation',clearConv]];
function palette(){modal('Command Palette','<input id="pq" placeholder="Type a command..." autocomplete="off"><div id="pl" style="margin-top:8px"></div>');pfill('');$('#pq').focus()}
function pfill(q){$('#pl').innerHTML=CMDS.map((c,i)=>[c,i]).filter(x=>x[0][0].toLowerCase().includes(q.toLowerCase())).map(x=>`<button class="pi" data-act="pc:${x[1]}">${x[0][0]}</button>`).join('')||'<div class="empty">No matching command</div>'}
function toggleTheme(){S.set.theme=S.set.theme==='dark'?'light':'dark';apply();save();render()}
function clearConv(){const c=cur();if(!c||!c.msgs.length)return toast('Nothing to clear');c.msgs=[];c.title='New chat';save();render();toast('Conversation cleared')}

/* ---------- Actions (event delegation) ---------- */
function act(a,p,el){switch(a){
 case 'nav':go(p);break;
 case 'new':newConv();save();go('chat');$('#inp').focus();break;
 case 'menu':$('#side').classList.toggle('open');$('#scrim').classList.toggle('show');break;
 case 'theme':toggleTheme();break;
 case 'api':openApi();break;
 case 'settings':openSettings();break;
 case 'palette':palette();break;
 case 'pc':{const f=CMDS[+p][1];mclose();f();break}
 case 'mc':mclose();break;
 case 'clear':clearConv();break;
 case 'qa':setPrompt(Q[p][1]);break;
 case 'tool':setPrompt(TOOLS[p][1]);break;
 case 'send':send();break;
 case 'attach':$('#file').click();break;
 case 'rmfile':R.file=null;chip();break;
 case 'mic':mic();break;
 case 'cp':{const c=cur();if(c&&c.msgs[+p])copy(c.msgs[+p].c);break}
 case 'cc':copy(el.closest('.code').querySelector('pre').textContent);break;
 case 'rg':{const c=cur();if(!c||R.busy)break;while(c.msgs.length&&c.msgs[c.msgs.length-1].r==='nova')c.msgs.pop();if(c.msgs.length)ask(c);else render();break}
 case 'open':S.cur=p;save();go('chat');break;
 case 'del':S.convs=S.convs.filter(c=>c.id!==p);if(S.cur===p)S.cur=S.convs[0]?S.convs[0].id:null;save();render();toast('Conversation deleted');break;
 case 'ren':{const c=S.convs.find(x=>x.id===p);if(!c)break;modal('Rename conversation',`<input id="rn" value="${esc(c.title)}" maxlength="80"><div class="row" style="margin-top:12px"><button class="btn pri" data-act="rens:${p}">Save</button></div>`);$('#rn').focus();break}
 case 'rens':{const c=S.convs.find(x=>x.id===p),v=$('#rn').value.trim();if(c&&v){c.title=v;save();mclose();render()}break}
 case 'eye':{const k=$('#a-k');k.type=k.type==='password'?'text':'password';break}
 case 'kc':{const v=$('#a-k').value;v?copy(v):toast('No key to copy','err');break}
 case 'asave':{const f=fields();if(!/^https?:\/\//i.test(f.endpoint))return toast('Endpoint must start with http(s)://','err');if(!f.model)return toast('Enter a model name','err');S.cfg=f;if(save()){toast('API settings saved');setStatus(f.key||f.provider==='llm7'?R.status:'off');render()}break}
 case 'aclear':S.cfg={provider:'llm7',key:'',model:P.llm7.model,endpoint:P.llm7.url};save();setStatus('off');openApi();render();toast('API settings cleared');break;
 case 'atest':testApi();break;
 case 'wipe':modal('Clear local data','<p>This deletes all conversations, settings and the saved API key from this browser.</p><div class="row"><button class="btn dng" data-act="wipe2">Delete everything</button><button class="btn" data-act="mc">Cancel</button></div>');break;
 case 'wipe2':try{localStorage.removeItem(KEY)}catch(e){}S=def();R.status='off';R.file=null;chip();apply();mclose();go('chat');toast('Local data cleared');break;
}}
async function testApi(){const f=fields();if(!/^https?:\/\//i.test(f.endpoint))return toast('Endpoint must start with http(s)://','err');
 setStatus('testing');try{extract(await call({messages:[{role:'user',content:'Reply with: ok'}],max_tokens:8},f));setStatus('ok');toast('Connection successful')}catch(e){setStatus('err');toast(e.message,'err')}}
function mic(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR)return toast('Speech recognition is not supported in this browser. Try Chrome or Edge.','err');
 if(R.rec){R.rec.stop();return}
 const r=new SR();r.lang='fa-IR';r.interimResults=false;r.continuous=false;R.rec=r;$('#micb').classList.add('rec');
 r.onresult=e=>{const t=Array.from(e.results).map(x=>x[0].transcript).join(' ');const i=$('#inp');i.value+=(i.value?' ':'')+t;resize()};
 r.onerror=e=>toast('Microphone error: '+(e.error==='not-allowed'?'permission denied':e.error),'err');
 r.onend=()=>{R.rec=null;$('#micb').classList.remove('rec')};
 try{r.start();toast('Listening...')}catch(e){R.rec=null;$('#micb').classList.remove('rec')}}

document.addEventListener('click',e=>{
 if(e.target.id==='modal')return mclose();
 const b=e.target.closest('[data-act]');if(!b)return;const s=b.dataset.act,i=s.indexOf(':');act(i<0?s:s.slice(0,i),i<0?'':s.slice(i+1),b)});
document.addEventListener('change',e=>{const t=e.target;
 if(t.id==='a-p'){const p=P[t.value];$('#a-e').value=p.url;$('#a-m').value=p.model;return}
 if(t.dataset.set){S.set[t.dataset.set]=t.type==='checkbox'?t.checked:t.value;apply();save();render()}});
document.addEventListener('input',e=>{if(e.target.id==='pq')pfill(e.target.value);if(e.target.id==='inp')resize()});
$('#file').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
 const o={name:f.name,size:f.size,text:null};
 if(f.size>2*1024*1024){toast('File is larger than 2 MB','err');return}
 if(f.type.startsWith('text/')||/\.(txt|md|json|csv|js|ts|py|html|css|xml|yml|yaml|log|java|c|cpp|go|rs|sh)$/i.test(f.name)){const r=new FileReader();r.onload=()=>{o.text=String(r.result).slice(0,60000);R.file=o;chip();toast('File attached')};r.onerror=()=>toast('Could not read file','err');r.readAsText(f)}
 else{R.file=o;chip();toast('Attached (content not readable as text)')}});
document.addEventListener('keydown',e=>{
 const mod=e.ctrlKey||e.metaKey;
 if(mod&&e.key.toLowerCase()==='k'){e.preventDefault();palette();return}
 if(e.key==='Escape'){if($('#modal').classList.contains('show'))mclose();else{$('#side').classList.remove('open');$('#scrim').classList.remove('show')}return}
 if(e.target.id==='pq'&&e.key==='Enter'){const f=$('#pl .pi');if(f)f.click();return}
 if(e.target.id==='inp'&&e.key==='Enter'&&!e.isComposing){if(mod||(S.set.enter&&!e.shiftKey)){e.preventDefault();send()}}});
addEventListener('online',()=>{render();toast('Back online')});
addEventListener('offline',()=>{render();toast('You are offline','err')});
setInterval(()=>document.querySelectorAll('.sess').forEach(e=>e.textContent=dur()),1000);

/* ---------- Init ---------- */
document.querySelectorAll('[data-i]').forEach(e=>e.insertAdjacentHTML('afterbegin',I(e.dataset.i)));
apply();render();chip();
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
