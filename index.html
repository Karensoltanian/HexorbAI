<style>

h2{margin:0 0 14px;font-size:1.2em}
.msgs{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

.body{padding:11px 14px;border-radius:16px;background:var(--pan);border:1px solid var(--bd);overflow-wrap:anywhere}

.code{margin:8px 0;border:1px solid var(--bd);border-radius:10px;overflow:hidden;direction:ltr;text-align:left}

.fbn{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px;padding:4px 10px;border-radius:10px;border:1px solid var(--bd);background:var(--pan);font-size:.78em;color:var(--mu);width:fit-content;max-width:100%;animation:rev .3s}

.dots i{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--ac);animation:dp 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dp{50%{transform:translateY(-5px);opacity:.4}}

.comp{max-width:920px;margin:0 auto}
.box{display:flex;align-items:flex-end;gap:6px;padding:6px;border:1px solid var(--bd);border-radius:18px;background:var(--pan2);transition:.2s}
.box:focus-within{border-color:var(--ac);box-shadow:var(--gl)}

.ib.rec{color:var(--er);border-color:var(--er);animation:br 1s infinite}
.send{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#041018;border:0}
.send:hover{color:#041018}
#chips{display:flex;gap:6px;flex-wrap:wrap}
.fchip{display:inline-flex;gap:8px;align-items:center;margin-bottom:6px;padding:4px 8px 4px 12px;border-radius:99px;border:1px solid var(--bd);font-size:.8em;background:var(--pan2)}

.gm{margin-bottom:6px;font-size:.8em;color:var(--ac);display:flex;gap:6px;align-items:center}
.row{display:flex;gap:8px;align-items:center}.row.wrap{flex-wrap:wrap}.row>input{flex:1;min-width:0}
.btn{padding:9px 16px;border-radius:12px;border:1px solid var(--bd);background:var(--pan2);min-height:42px;display:inline-flex;gap:8px;align-items:center;justify-content:center;transition:.2s}
.btn:hover{border-color:var(--ac);box-shadow:var(--gl)}
.btn.pri{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#041018;font-weight:700;border:0}
.btn.dng{color:var(--er)}.btn.sm{min-height:32px;padding:4px 10px;font-size:.85em}.btn.full{width:100%}
input,select{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--pan2);outline:0;font-size:16px}
input:focus,select:focus{border-color:var(--ac)}
label{display:block;margin-bottom:12px;font-size:.85em;color:var(--mu)}label input,label select{margin-top:4px;color:var(--tx)}
label.sw{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--tx);margin-bottom:8px}label.sw input{width:22px;height:22px;margin:0;accent-color:var(--ac)}
.seg{display:flex;border:1px solid var(--bd);border-radius:12px;overflow:hidden}.seg button{flex:1;padding:8px;color:var(--mu);min-height:38px}.seg button.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#041018;font-weight:700}

.mem{display:flex;gap:6px;align-items:center;margin-bottom:8px}.mem input{flex:1}

#login{position:fixed;top:0;right:0;bottom:0;left:0;z-index:70;display:grid;place-items:center;padding:16px;overflow-y:auto;background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:36px 36px}

.rm *,.rm *::before{animation:none!important;transition:none!important}

/* animated icons */
.i .f{fill:currentColor;fill-opacity:.16}.i .d{fill:currentColor}
.i *{transform-box:fill-box;transform-origin:center}
.i .hand,.i .hand2{transform-box:view-box;transform-origin:12px 12px}
.i .a-rays{transform-box:view-box;transform-origin:12px 12px}
.i .l1,.i .l2,.i .l3{transform-origin:left center}
.i .b1,.i .b2,.i .b3{transform-origin:center bottom}

.i .g1{animation:pp 1.2s infinite}.i .g2{animation:pp 1.2s .15s infinite}.i .g3{animation:pp 1.2s .45s infinite}.i .g4{animation:pp 1.2s .3s infinite}

function inl(s){return s.replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/(^|[^*\w])\*([^\s*][^*\n]*?[^\s*]|[^\s*])\*(?![*\w])/g,'$1<i>$2</i>').replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>').replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,(m,p,u)=>p+'<a href="'+u+'" target="_blank" rel="noopener noreferrer">'+u+'</a>')}
function md(s){const ln=s.split('\n');let out='',i=0,m;
 const row=l=>/^\s*\|.*\|\s*$/.test(l),sep=l=>/^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l);
 const cells=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>inl(c.trim()));
 while(i<ln.length){const l=ln[i];
  if(row(l)&&i+1<ln.length&&sep(ln[i+1])){const h=cells(l);i+=2;const rs=[];while(i<ln.length&&row(ln[i])){rs.push(cells(ln[i]));i++}
   out+='<div class="tbl"><table><thead><tr>'+h.map(c=>'<th>'+c+'</th>').join('')+'</tr></thead><tbody>'+rs.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';continue}
  if((m=l.match(/^#{1,3} (.+)$/))){out+='<h4>'+inl(m[1])+'</h4>';i++;continue}
  if(/^\s*[-*•] /.test(l)){let it='';while(i<ln.length&&(m=ln[i].match(/^\s*[-*•] (.+)$/))){it+='<li>'+inl(m[1])+'</li>';i++}out+='<ul>'+it+'</ul>';continue}
  if(/^\s*\d+[.)] /.test(l)){let it='';while(i<ln.length&&(m=ln[i].match(/^\s*\d+[.)] (.+)$/))){it+='<li>'+inl(m[1])+'</li>';i++}out+='<ol>'+it+'</ol>';continue}
  if(/^&gt; ?/.test(l)){let q='';while(i<ln.length&&(m=ln[i].match(/^&gt; ?(.*)$/))){q+=inl(m[1])+'<br>';i++}out+='<blockquote>'+q+'</blockquote>';continue}
  if(/^\s*(-{3,}|\*{3,})\s*$/.test(l)){out+='<hr>';i++;continue}
  if(l.trim()===''){if(out&&!/(<\/ul>|<\/ol>|<\/blockquote>|<\/div>|<\/h4>|<hr>|<br>)$/.test(out))out+='<br>';i++;continue}
  out+=inl(l)+(i<ln.length-1?'<br>':'');i++}
 return out.replace(/(<br>)+$/,'')}
function fmt(s){return String(s||'').split('```').map((p,i)=>{if(i%2){const n=p.indexOf('\n'),lg=n>-1?p.slice(0,n).trim():'',code=n>-1?p.slice(n+1):p;return `<div class="code"><div class="ch"><span>${esc(lg||'code')}</span><button data-act="cc">${I('copy')}${t('copy')}</button></div><pre>${esc(code)}</pre></div>`}
return md(esc(p))}).join('')}

/* ---------- Identity + memory ---------- */
function sysPrompt(){
 let s="You are HEXORB, a futuristic AI assistant. Never describe yourself as a HUD. Reply in the language the user writes in. Use markdown code fences for code. If asked who or what you are, say you are HEXORB, an AI assistant. If asked who made, built or developed you, say your creator and developer is Karen Soltanian (Persian: کارن سلطانیان). Never claim to be a product of any other company or model. Never repeat yourself: if the user asks something you already answered, give a fresh answer with different wording, a new angle or extra detail instead of copying your earlier reply.";
 if(UI.memOn&&D.mem.length)s+="\nLong-term memory about the user (use it naturally, do not recite it unless asked):\n"+D.mem.slice(-40).map(m=>'- '+m.text).join('\n');
 return s}
const IDV={en:{maker:['I was created and developed by Karen Soltanian.','My creator and developer is Karen Soltanian.','Karen Soltanian is the one who designed and developed me.'],who:['I am HEXORB, an AI assistant.',"I'm HEXORB, your AI assistant.",'HEXORB here, an AI assistant ready to help.']},
fa:{maker:['سازنده و توسعه‌دهنده‌ی من کارن سلطانیان است.','من را کارن سلطانیان ساخته و توسعه داده است.','کارن سلطانیان من را طراحی و برنامه‌نویسی کرده است.'],who:['من HEXORB هستم، یک دستیار هوش مصنوعی.','من HEXORB هستم، دستیار هوشمند تو.','اسم من HEXORB است و یک دستیار هوش مصنوعی هستم.']}};
function pick(arr,key){let i;do{i=Math.floor(Math.random()*arr.length)}while(arr.length>1&&i===pick.last[key]);pick.last[key]=i;return arr[i]}
pick.last={};
function identity(text){const x=text.trim();if(x.length>80)return null;const l=/[\u0600-\u06FF]/.test(x)?'fa':'en';
 if(/سازنده|توسعه\s?دهنده|برنامه\s?نویس|دولوپر|طراح\s+(تو|شما|این)|کی\s+(تو|شما)?\s*(رو|را)?\s*(ساخته|ساخت|نوشته|نوشت|طراحی)|who\s+(made|built|created|developed|designed)\s+(you|this|hexorb)|(your|the)\s+(creator|developer|maker|author)|developer\s+of\s+(this|hexorb)/i.test(x))return pick(IDV[l].maker,'m');
 if(/(تو|شما)\s*کی\s*(هستی|هستید|هستین)|کی\s*هستی|تو\s*چی\s*هستی|who\s+(are|r)\s+(you|u)|what\s+are\s+you/i.test(x))return pick(IDV[l].who,'w');
 return null}
function addMem(text,src){text=text.trim();if(text.length<3)return false;const k=text.toLowerCase();if(D.mem.some(m=>m.text.toLowerCase()===k))return false;
 const m={id:uid(),text,ts:Date.now(),src:src||'auto'};D.mem.push(m);if(D.mem.length>60){const o=D.mem.shift();if(U&&Cloud.ok)Cloud.delMem(U.uid,o.id).catch(syncErr)}
 saveD();if(U&&Cloud.ok)Cloud.saveMem(U.uid,m).catch(syncErr);return true}
async function learn(text){
 if(!UI.memOn||text.length<12)return;
 const m=text.match(/^\s*(remember(?: that)?|یادت باشه|یادت بمونه|به خاطر بسپار)[:\s,،]+([\s\S]+)/i);
 if(m){if(addMem(m[2].slice(0,300),'manual'))toast(t('memUpdated'));return}
 D.lc=(D.lc||0)+1;if(D.lc%2)return;
 try{const r=extract(await call({max_tokens:200,temperature:0,messages:[{role:'system',content:'Extract durable facts or preferences about the USER from their message (name, job, city, language, projects, tastes). Never include passwords, keys, ID or card numbers. Output ONLY a JSON array of up to 3 short strings in the same language as the message. Output [] if nothing durable.'},{role:'user',content:text.slice(0,1200)}]}));
  const a=JSON.parse((r.match(/\[[\s\S]*\]/)||['[]'])[0]);let ch=false;
  a.filter(x=>typeof x==='string').slice(0,3).forEach(x=>{if(addMem(x.slice(0,200),'auto'))ch=true});if(ch)toast(t('memUpdated'))}catch(e){}}

function buildMsgs(c,prev){
 const h=c.msgs.filter(m=>!m.e&&!m.gen&&!m.stream).slice(-20);let lastImg=-1;h.forEach((m,i)=>{if(m.img&&m.img.length)lastImg=i});

  if(m.r!=='user')return{role:'assistant',content:m.c||''};

const LG={mode:'in',err:'',ok:''};
function authMsg(e){const c=(e&&e.code)||'';
 if(/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c))return t('e_cred');
 if(c==='auth/email-already-in-use')return t('e_used');if(c==='auth/weak-password')return t('e_weak');if(c==='auth/invalid-email')return t('e_mail');
 if(c==='auth/too-many-requests')return t('e_many');if(c==='auth/network-request-failed')return t('e_net');if(c==='auth/unauthorized-domain')return t('e_domain');
 if(c==='auth/popup-closed-by-user'||c==='auth/cancelled-popup-request')return '';
 return t('e_gen')+(e&&e.message?' ('+String(e.message).slice(0,120)+')':'')}
function loginHTML(){
 const ok=Cloud.ok,m=LG.mode;
 let h=`<div class="lt">${seg([['en','EN'],['fa','فا']],UI.lang,'lang')}</div><div class="card">${core}<h1 class="brand">HEXORB</h1><p class="sub">${t('loginSub')}</p>`;
 if(!ok){h+=`<div class="warn">${Cloud.cfgd?t('e_net'):t('noServer')}</div>`+(Cloud.cfgd?`<button class="btn full" data-act="reload" style="margin-bottom:10px">${I('refresh')}${t('retry')}</button>`:'')}
 else{
  if(m!=='reset')h+=`<button class="btn gbtn full" data-act="lgoogle">${GOOGLE}${t('google')}</button><div class="or">${t('or')}</div>`;
  h+=`<form id="lform" novalidate>`;
  if(m==='up')h+=`<label>${t('name')}<input id="lg-n" autocomplete="name" maxlength="40"></label>`;
  h+=`<label>${t('email')}<input id="lg-e" type="email" autocomplete="email" dir="ltr"></label>`;
  if(m!=='reset')h+=`<label>${t('pass')}<input id="lg-p" type="password" autocomplete="${m==='up'?'new-password':'current-password'}" dir="ltr"></label>`;
  h+=`<p class="lerr" id="lerr">${esc(LG.err)}</p>${LG.ok?`<p class="note" style="color:var(--ok)">${esc(LG.ok)}</p>`:''}<button class="btn pri full" type="submit">${m==='up'?t('signup'):m==='reset'?t('sendReset'):t('signIn')}</button></form>`;
  h+=`<div class="row wrap" style="justify-content:space-between;margin-top:8px">`+(m==='in'?`<button class="link" data-act="lmode:reset">${t('forgot')}</button><button class="link" data-act="lmode:up">${t('noAcc')}</button>`:m==='up'?`<button class="link" data-act="lmode:in">${t('haveAcc')}</button>`:`<button class="link" data-act="lmode:in">${t('backIn')}</button>`)+`</div><div class="or">${t('or')}</div>`}
 h+=`<button class="btn full" data-act="lguest">${I('user')}${t('guestBtn')}</button><p class="note" style="text-align:center;margin:12px 0 0"><a class="link" href="privacy.html" target="_blank" rel="noopener">${t('privacy')}</a></p></div>`;return h}
function showLogin(err,mode){LG.err=err||'';LG.ok='';if(mode)LG.mode=mode;const l=$('#login');l.hidden=false;l.innerHTML=loginHTML()}

function showSplash(){const l=$('#login');l.hidden=false;l.innerHTML=`<div class="card" style="text-align:center">${core}<h1 class="brand">HEXORB</h1><p class="sub"><span class="dots"><i></i><i></i><i></i></span></p></div>`}
async function doAuth(kind){
 const v=id=>($(id)&&$(id).value||'').trim();const n=v('#lg-n'),e=v('#lg-e'),p=($('#lg-p')&&$('#lg-p').value)||'';
 LG.err='';LG.ok='';const er=m=>{LG.err=m;const x=$('#lerr');if(x)x.textContent=m};
 try{
  if(kind==='google')await Cloud.google();
  else if(kind==='in'){if(!e||!p)return er(t('e_fill'));await Cloud.signIn(e,p)}
  else if(kind==='up'){if(!n||!e||!p)return er(t('e_fill'));await Cloud.signUp(n,e,p)}
  else if(kind==='reset'){if(!e)return er(t('e_fill'));await Cloud.reset(e);LG.ok=t('resetSent');$('#login').innerHTML=loginHTML()}
 }catch(err){er(authMsg(err))}}
function mergeConvs(srv){
 const ids={};srv.forEach(s=>{ids[s.id]=1;const l=D.convs.find(c=>c.id===s.id);if(!l)D.convs.push(s);else if((s.ts||0)>=(l.ts||0)){Object.assign(l,s)}else pushConv(l)});
 D.convs.forEach(c=>{if(!ids[c.id])pushConv(c)});D.convs.sort((a,b)=>b.ts-a.ts);if(!D.cur||!cur())D.cur=D.convs[0]?D.convs[0].id:null}
function mergeMem(srv){const ids={};srv.forEach(s=>{ids[s.id]=1;const l=D.mem.find(m=>m.id===s.id);if(l)Object.assign(l,s);else D.mem.push(s)});D.mem.forEach(m=>{if(!ids[m.id])Cloud.saveMem(U.uid,m).catch(syncErr)});D.mem.sort((a,b)=>a.ts-b.ts)}
async function onUser(fu){
 const email=fu.email||'';
 U={uid:fu.uid,name:fu.displayName||(email.split('@')[0])||'user',email,photo:fu.photoURL||'',verified:!!fu.emailVerified,owner:!!OWNER&&email.toLowerCase()===OWNER&&!!fu.emailVerified};
 UI.guest=false;sv(UIK,UI);
 try{
  const rec=await Cloud.getUser(fu.uid);
  if(rec&&rec.banned===true){await Cloud.out();U=null;D=blankD();showLogin(t('banned'));return}
  const base={name:U.name,email:U.email,photo:U.photo,lastSeen:Date.now()};
  await Cloud.setUser(fu.uid,rec?base:Object.assign({createdAt:Date.now(),msgs:0},base));
  loadD();
  const r=await Promise.all([Cloud.loadConvs(fu.uid),Cloud.loadMem(fu.uid)]);
  mergeConvs(r[0]);mergeMem(r[1]);
  if(rec&&rec.settings){Object.assign(UI,rec.settings,{guest:false});sv(UIK,UI);applyAll()}
  saveD();flushFb();
 }catch(e){console.warn(e);loadD();toast(String(e.message||e).slice(0,140),'err')}
 hideLogin();R.view='chat';render();loadAnn()}
async function logout(){mclose();if(Cloud.ok&&U){try{await Cloud.out()}catch(e){}}U=null;UI.guest=false;sv(UIK,UI);D=blankD();render();showLogin()}

function act(a,p,el){switch(a){
 case 'nav':go(p);break;
 case 'new':newConv();saveD();go('chat');$('#inp').focus();break;
 case 'menu':$('#side').classList.toggle('open');$('#scrim').classList.toggle('show');break;
 case 'theme':toggleTheme();break;
 case 'themeset':UI.theme=p;applyAll();saveUI();render();if(!$('#qs').hidden){$('#qs').hidden=true;openQS()}else if($('#modal').classList.contains('show'))openSettings('general');break;
 case 'lang':UI.lang=p;applyAll();saveUI();render();if(!$('#login').hidden)showLogin(LG.err);else if(!$('#qs').hidden){$('#qs').hidden=true;openQS()}else if($('#modal').classList.contains('show'))openSettings('general');break;
 case 'api':openApi();break;
 case 'settings':$('#qs').hidden=true;openSettings(p);break;
 case 'qs':openQS();break;
 case 'palette':palette();break;
 case 'pc':{const f=cmds()[+p][2];mclose();f();break}

 case 'send':send();break;
 case 'stop':R.stopped=true;if(R.abort)R.abort.abort();break;

 case 'rmf':R.files.splice(+p,1);chips();break;
 case 'mic':mic();break;
 case 'cp':{const c=cur(),m=c&&c.msgs[+p];if(m)copy(m.gen?m.gen.url:m.c);break}
 case 'cc':copy(el.closest('.code').querySelector('pre').textContent);break;

  const prev=(last&&last.c)||'';while(c.msgs.length&&c.msgs[c.msgs.length-1].r==='ai')c.msgs.pop();if(c.msgs.length)ask(c,'',prev);else render();break}

 case 'saveimg':{const c=cur(),m=c&&c.msgs[+p];if(!m||!m.gen)break;fetch(m.gen.url).then(r=>r.blob()).then(b=>{const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='hexorb-'+Date.now()+'.png';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}).catch(()=>window.open(m.gen.url,'_blank'));break}

 case 'open':D.cur=p;saveD();go('chat');break;

function mic(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR)return toast(t('micUnsupported'),'err');if(R.rec){R.rec.stop();return}
 const r=new SR();r.lang=lang==='fa'?'fa-IR':'en-US';r.interimResults=false;r.continuous=false;R.rec=r;$('#micb').classList.add('rec');
 r.onresult=e=>{const x=Array.from(e.results).map(y=>y[0].transcript).join(' ');const i=$('#inp');i.value+=(i.value?' ':'')+x;resize()};
 r.onerror=e=>toast('Mic: '+(e.error==='not-allowed'?'permission denied':e.error),'err');

 if(e.target.id==='modal'){mclose();return}

 if(x.id==='a-p'){const p=P[x.value];$('#a-e').value=p.url;$('#a-m').value=p.model;return}
 if(x.dataset.set){UI[x.dataset.set]=x.type==='checkbox'?x.checked:x.value;applyAll();saveUI();render();return}
 if(x.dataset.api){API[x.dataset.api]=x.value.trim()||IMG_DEFAULT;saveAPI();toast(t('saved'))}});

$('#file').addEventListener('change',async e=>{const fs=Array.from(e.target.files);e.target.value='';
 for(const f of fs){if(R.files.length>=4)break;if(f.size>4*1024*1024){toast(t('fileBig'),'err');continue}
  try{if(f.type.indexOf('image/')===0){R.files.push({kind:'img',name:f.name,data:await shrink(f,896,.7)})}
   else if(f.type.indexOf('text/')===0||/\.(txt|md|json|csv|js|ts|py|html|css|xml|yml|yaml|log|java|c|cpp|go|rs|sh)$/i.test(f.name)){const tx=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).slice(0,60000));r.onerror=no;r.readAsText(f)});R.files.push({kind:'txt',name:f.name,text:tx})}
   else R.files.push({kind:'bin',name:f.name,text:null})}catch(err){toast('Could not read '+f.name,'err')}}
 chips()});

 if(e.target.id==='pq'&&e.key==='Enter'){const f=$('#pl .pi');if(f)f.click();return}
